[package]
name = "jevdev"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A coding-agent harness built around Jev, TypeSafe's System One decision model: explicit typed state, per-turn context assembly, cost-priced routing, tiered tools, and policy-gated permissions."
license = "Apache-2.0"
repository = "https://github.com/ibrahimcesar/jevdev"
homepage = "https://github.com/ibrahimcesar/jevdev"
documentation = "https://docs.rs/jevdev"
readme = "README.md"
keywords = ["jev", "agent", "harness", "coding-agent", "typesafe"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "docs/", "*.pdf", ".jevdev/"]

[[bin]]
name = "jevdev"
path = "src/main.rs"

[lib]
name = "jevdev"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
blake3 = "1"
hex = "0.4"
redb = "2"
im = "15"
moka = { version = "0.12", features = ["future"] }
schemars = "1"
jsonschema = { version = "0.57", default-features = false }
cedar-policy = "4"
globset = "0.4"
ignore = "0.4"
regex = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
shell-words = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
